aid: cloudploy

name: CloudPloy

image: https://cloudploy.com/cloudploy-share-light-2026.png

description: CloudPloy provides a platform that lets developers deploy applications to any cloud or VPS using AI agents. Through its MCP (Machine
  Control Plane), users can manage servers, apps, and deployments via a RESTful API, enabling automation of the full lifecycle from provisioning
  to scaling. The service offers a free tier with limited resources and paid plans for larger workloads, focusing on ease of use, security, and
  integration with existing CI/CD pipelines.

